version: 6
id: orion-technologies-v6
initial:
  hulls: [fighter, corvette, colonizer]
  components: [engine, beam]
nodes:
  - id: engineering
    name: Инженерные методы
    prerequisites: []
    researchCost: 2000
    effects:
      - {kind: variant-tier, tier: 2}
      - {kind: strategic-range, maxJumpDistance: 400}
  - id: applied
    name: Прикладные службы
    prerequisites: []
    researchCost: 2000
    effects:
      - {kind: component-unlock, component: mining}
      - {kind: component-unlock, component: repair}
      - {kind: component-unlock, component: scanner}
      - {kind: component-unlock, component: cargoExpansion}
  - id: support
    name: Флотская инфраструктура
    prerequisites: []
    researchCost: 3000
    effects:
      - {kind: hull-unlock, hullId: frigate}
      - {kind: component-unlock, component: shield}
      - {kind: component-unlock, component: armor}
  - id: ordnance
    name: Тяжёлое вооружение
    prerequisites: [engineering, support]
    researchCost: 6000
    effects:
      - {kind: hull-unlock, hullId: destroyer}
      - {kind: hull-unlock, hullId: cruiser}
      - {kind: component-unlock, component: projectile}
      - {kind: variant-tier, tier: 3}
      - {kind: strategic-range, maxJumpDistance: 800}
  - id: capital
    name: Линейные корабли
    prerequisites: [ordnance]
    researchCost: 12000
    effects:
      - {kind: hull-unlock, hullId: battleship}
      - {kind: variant-tier, tier: 4}
      - {kind: strategic-range, maxJumpDistance: 1500}
  - id: biology
    name: Биология
    prerequisites: []
    researchCost: 2000
    effects:
      - {kind: colony-effect, effectId: biology-growth}
  - id: biosphere
    name: Биосфера
    prerequisites: [biology]
    researchCost: 4000
    effects:
      - {kind: colony-effect, effectId: biosphere-capacity}
  - id: automation
    name: Автоматизация
    prerequisites: [engineering]
    researchCost: 3000
    effects:
      - {kind: colony-effect, effectId: automation-output}
  - id: scientific-method
    name: Научные методы
    prerequisites: [applied]
    researchCost: 3000
    effects:
      - {kind: colony-effect, effectId: scientific-output}
  - id: cultural-practices
    name: Культурные практики
    prerequisites: []
    researchCost: 2000
    effects:
      - {kind: colony-effect, effectId: cultural-output}
  - id: toxic-adaptation
    name: Адаптация к токсичной среде
    prerequisites: []
    researchCost: 3000
    effects:
      - {kind: colonization-unlock, worldType: toxic}
variantPolicy:
  id: component-bands-v1
  tiers:
    - {level: 1, magnitude: 0.1, ratioStep: 0.05, ammo: 0.1, rechargeDelay: 0.5}
    - {level: 2, magnitude: 0.2, ratioStep: 0.1, ammo: 0.2, rechargeDelay: 1}
    - {level: 3, magnitude: 0.3, ratioStep: 0.15, ammo: 0.3, rechargeDelay: 1.5}
    - {level: 4, magnitude: 0.4, ratioStep: 0.2, ammo: 0.4, rechargeDelay: 2}
